{% extends "base.html" %}

{% block title %}Вход для преподавателя | uni-test-sentinel{% endblock %}

{% block body %}
<div class="min-h-full flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-50">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-slate-900 text-white shadow-lg mb-3">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">
                Вход для преподавателя
            </h2>
            <p class="mt-1 text-xs text-slate-500">
                Панель управления тестированием uni-test-sentinel
            </p>
        </div>

        {% if error %}
        <div class="mt-4 p-3 rounded-xl bg-red-50 border border-red-200 text-xs text-red-700">
            {{ error }}
        </div>
        {% endif %}

        <div class="mt-6 bg-white py-6 px-6 shadow-xl shadow-slate-200/60 rounded-2xl border border-slate-100">
            <form action="/admin/login" method="POST" class="space-y-4">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700">
                        Пароль администратора
                    </label>
                    <div class="mt-1">
                        <input type="password" id="password" name="password" required
                               placeholder="Введите пароль из .env"
                               class="block w-full rounded-xl border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500/20 text-sm">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-2.5 px-4 rounded-xl font-bold text-white bg-slate-900 hover:bg-slate-800 transition-all text-sm shadow-md">
                    Войти в панель
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
